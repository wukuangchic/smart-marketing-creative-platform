server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name YOUR_PUBLIC_IP;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}
